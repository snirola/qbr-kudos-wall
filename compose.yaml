services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./KudosWall.Api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__KudosWall: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: https://www.kudos-evotix.com
      Cors__AllowedOrigins__1: http://localhost:3000
    ports:
      - "5080:8080"

volumes:
  postgres-data:
