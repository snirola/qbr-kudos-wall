<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Heroes & Team Legends - CSM Kudos Wall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
:root {
  --navy: #0F1B3E;
  --purple: #8B5CF6;
  --blue: #3B82F6;
  --orange: #FF8B3B;
  --cream: #FFF8F0;
}
.app { display: flex; flex-direction: column; height: 100vh; }
.nav { display: flex; gap: 8px; padding: 12px; background: linear-gradient(135deg, var(--navy) 0%, #1a2a5a 100%); border-bottom: 3px solid var(--purple); }
.nav button { flex: 1; padding: 10px 12px; border: 2px solid transparent; background: rgba(255,255,255,0.1); color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s; }
.nav button:hover { background: rgba(139, 92, 246, 0.2); }
.nav button.active { background: var(--purple); border-color: var(--orange); box-shadow: 0 0 12px rgba(255, 139, 59, 0.4); }
.main { flex: 1; overflow-y: auto; padding: 16px; background: linear-gradient(180deg, rgba(139, 92, 246, 0.05) 0%, rgba(59, 130, 246, 0.05) 100%); }
.panel { background: var(--cream); border: 2px solid var(--purple); border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15); }
.panel h2 { margin: 0 0 4px 0; font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--navy) 0%, var(--purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.panel .subtitle { margin: 0 0 20px 0; font-size: 14px; color: #666; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
.form-group input, .form-group textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--purple); border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; color: var(--navy); }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255, 139, 59, 0.1); }
.form-group textarea { resize: vertical; min-height: 60px; }
.category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
.pill { padding: 10px 12px; border: 2px solid var(--purple); background: #fff; color: var(--navy); border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; }
.pill:hover { border-color: var(--orange); transform: translateY(-2px); }
.pill.selected { background: linear-gradient(135deg, var(--purple) 0%, var(--purple) 100%); color: #fff; border-color: var(--orange); }
.emoji-input { display: flex; gap: 8px; flex-wrap: wrap; }
.emoji-btn { width: 44px; height: 44px; border: 2px solid var(--purple); background: #fff; border-radius: 8px; cursor: pointer; font-size: 24px; transition: all 0.3s; }
.emoji-btn:hover { transform: scale(1.1); }
.emoji-btn.selected { background: linear-gradient(135deg, var(--purple) 0%, var(--purple) 100%); border-color: var(--orange); }
.error { font-size: 12px; color: #E53E3E; margin-top: 4px; }
.button-row { display: flex; gap: 8px; }
.btn { padding: 12px 20px; border: 2px solid var(--purple); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; background: #fff; color: var(--navy); transition: all 0.3s; }
.btn:hover { border-color: var(--orange); transform: translateY(-2px); }
.btn.primary { background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%); color: #fff; border-color: transparent; box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4); }
.btn.primary:hover { box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6); }
.wall { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-height: calc(100vh - 200px); overflow-y: auto; padding-right: 8px; }
.wall::-webkit-scrollbar { width: 8px; }
.wall::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; }
.card { background: linear-gradient(135deg, #fff 0%, var(--cream) 100%); border: 2px solid var(--purple); border-radius: 12px; padding: 20px; position: relative; transition: all 0.3s; }
.card:hover { transform: translateY(-8px); box-shadow: 0 12px 32px rgba(139, 92, 246, 0.25); }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--purple) 0%, var(--blue) 100%); }
.card-category { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; color: #fff; background: var(--purple); }
.card-header { display: flex; gap: 12px; margin-bottom: 12px; }
.card-emoji { font-size: 36px; line-height: 1; }
.card-colleague { font-size: 15px; font-weight: 700; color: var(--navy); margin: 0; }
.card-message { font-size: 13px; color: #444; line-height: 1.6; margin: 8px 0; }
.card-footer { font-size: 11px; color: #999; }
.empty { text-align: center; padding: 60px 20px; color: var(--navy); grid-column: 1/-1; }
.empty-icon { font-size: 64px; margin-bottom: 16px; }
.presentation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, var(--navy) 0%, #1a2a5a 50%, var(--purple) 100%); display: flex; flex-direction: column; padding: 40px; overflow: auto; z-index: 1000; }
.presentation .title { font-size: 72px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 12px; text-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.presentation .tagline { font-size: 28px; color: var(--cream); text-align: center; margin-bottom: 48px; }
.presentation .wall { max-height: calc(100vh - 240px); }
.presentation .close { position: fixed; top: 20px; right: 20px; background: var(--orange); border: none; color: #fff; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; }
.modal.hidden { display: none; }
.modal-content { background: var(--cream); border: 2px solid var(--purple); border-radius: 12px; padding: 32px; max-width: 320px; text-align: center; }
.modal-content h2 { margin: 0 0 12px 0; color: var(--navy); }
.modal-content p { margin: 0 0 16px 0; font-size: 14px; color: #666; }
.modal-content p.error { color: #E53E3E; font-weight: 600; margin: 0 0 8px 0; }
.modal-content input { width: 100%; padding: 12px 14px; border: 2px solid var(--purple); border-radius: 8px; margin-bottom: 12px; }
.modal-content .error { color: #E53E3E; font-size: 12px; margin-top: 8px; }
.modal-content .btn { width: 100%; margin-bottom: 8px; }
.toast { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%); color: #fff; padding: 16px 24px; border-radius: 8px; font-weight: 600; z-index: 100; display: none; }
.view { display: none; }
.view.active { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <button class="nav-btn active" data-view="submit">✨ Submit kudos</button>
    <button class="nav-btn" data-view="wall">🎉 View wall</button>
    <button class="nav-btn" data-view="present">🚀 Present</button>
  </div>
  
  <div class="main">
    <div class="view active" id="submit-view">
      <div class="panel">
        <h2>🏆 Shout Out a Legend</h2>
        <p class="subtitle">Who made an impact this quarter? Share it here.</p>
        
        <div class="form-group">
          <label>Shout-out to:</label>
          <input type="text" id="name-input" placeholder="Teammate's name" />
          <div class="error" id="name-error"></div>
        </div>
        
        <div class="form-group">
          <label>For:</label>
          <textarea id="message-input" placeholder="What did they do? One sentence."></textarea>
          <div class="error" id="message-error"></div>
        </div>
        
        <div class="form-group">
          <label>Category:</label>
          <div class="category-grid">
            <button class="pill selected" data-cat="customer-hero">💚 Customer Hero</button>
            <button class="pill" data-cat="save">🚨 Save</button>
            <button class="pill" data-cat="teammate">🤝 Teammate</button>
            <button class="pill" data-cat="brain">🧠 Brain</button>
            <button class="pill" data-cat="unsung">🕵️ Unsung</button>
            <button class="pill" data-cat="easier">✨ Easier</button>
          </div>
        </div>
        
        <div class="form-group">
          <label>Emoji:</label>
          <div class="emoji-input">
            <button class="emoji-btn selected" data-emoji="😎">😎</button>
            <button class="emoji-btn" data-emoji="🚀">🚀</button>
            <button class="emoji-btn" data-emoji="🦸">🦸</button>
            <button class="emoji-btn" data-emoji="🔥">🔥</button>
            <button class="emoji-btn" data-emoji="⭐">⭐</button>
            <button class="emoji-btn" data-emoji="💪">💪</button>
          </div>
        </div>
        
        <div class="button-row">
          <button class="btn primary" id="submit-btn">Post to wall</button>
          <button class="btn" id="clear-btn">Clear</button>
        </div>
      </div>
    </div>
    
    <div class="view" id="wall-view">
      <h3 style="color: var(--navy); margin: 0 0 20px 0;">🏆 Customer Heroes & Team Legends</h3>
      <div class="wall" id="wall-container"></div>
    </div>
  </div>
</div>

<div id="presentation-view" class="presentation" style="display: none;">
  <button class="close" onclick="exitPresentation()">Exit</button>
  <div class="title">🏆 Customer Heroes & Team Legends</div>
  <div class="tagline">Celebrating our squad</div>
  <div class="wall" id="presentation-wall"></div>
</div>

<div class="modal hidden" id="password-modal">
  <div class="modal-content">
    <h2>🔐 Restricted Access</h2>
    <p class="error">Sorry, you don't have access to this view</p>
    <p style="font-size: 12px; color: #999;">Team leads only. Enter password.</p>
    <input type="password" id="password-input" placeholder="Password" />
    <div class="error" id="password-error"></div>
    <button class="btn primary" id="password-submit">Unlock</button>
    <button class="btn" id="password-cancel">Back</button>
  </div>
</div>

<div class="toast" id="toast">✨ Thanks for your submission!</div>

<script>
const SUPABASE_URL = 'https://qcgwwgehplbhqpslaxoj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XlBvR3TC4VN5hNl0NJqlMg_pfrAcEtf';
const PASSWORD = 'QBRKudos';

let supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let category = 'customer-hero';
let emoji = '😎';
let authenticated = false;

const catLabels = {
  'customer-hero': '💚 Customer Hero',
  'save': '🚨 Save of Quarter',
  'teammate': '🤝 Ultimate Teammate',
  'brain': '🧠 Brain Trust',
  'unsung': '🕵️ Unsung Hero',
  'easier': '✨ Made Life Easier'
};

// Load kudos
async function loadKudos() {
  const { data, error } = await supabase.from('kudos').select('*').order('created_at', { ascending: false });
  return data || [];
}

// Render wall
async function renderWall() {
  const container = document.getElementById('wall-container');
  container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;">Loading...</div>';
  
  const kudos = await loadKudos();
  if (kudos.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🌟</div><div>No legends yet. Be first!</div></div>';
    return;
  }
  
  container.innerHTML = kudos.map(k => `
    <div class="card">
      <div class="card-category">${catLabels[k.category] || k.category}</div>
      <div class="card-header">
        <div class="card-emoji">${k.emoji || '😎'}</div>
        <div>
          <p class="card-colleague">${escapeHtml(k.name)}</p>
          <small style="color: var(--purple); font-weight: 600;">${catLabels[k.category] || k.category}</small>
        </div>
      </div>
      <div class="card-message">${escapeHtml(k.message)}</div>
      <div class="card-footer">${new Date(k.created_at).toLocaleDateString()}</div>
    </div>
  `).join('');
}

// Render presentation
async function renderPresentation() {
  const container = document.getElementById('presentation-wall');
  const kudos = await loadKudos();
  container.innerHTML = kudos.map(k => `
    <div class="card">
      <div class="card-category">${catLabels[k.category] || k.category}</div>
      <div class="card-header">
        <div class="card-emoji">${k.emoji || '😎'}</div>
        <div>
          <p class="card-colleague">${escapeHtml(k.name)}</p>
          <small style="color: #fff; font-weight: 600;">${catLabels[k.category] || k.category}</small>
        </div>
      </div>
      <div class="card-message">${escapeHtml(k.message)}</div>
      <div class="card-footer">${new Date(k.created_at).toLocaleDateString()}</div>
    </div>
  `).join('');
  document.getElementById('presentation-view').style.display = 'flex';
}

function exitPresentation() {
  document.getElementById('presentation-view').style.display = 'none';
  switchView('wall');
}

function switchView(view) {
  if ((view === 'wall' || view === 'present') && !authenticated) {
    document.getElementById('password-modal').classList.remove('hidden');
    document.getElementById('password-input').focus();
    document.getElementById('password-input').dataset.target = view;
    return;
  }
  
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`).classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`${view}-view`).classList.add('active');
  
  if (view === 'wall') renderWall();
  if (view === 'present') renderPresentation();
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

// Events
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', e => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
    e.target.classList.add('selected');
    category = e.target.dataset.cat;
  });
});

document.querySelectorAll('.emoji-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
    e.target.classList.add('selected');
    emoji = e.target.dataset.emoji;
  });
});

document.getElementById('submit-btn').addEventListener('click', async () => {
  const name = document.getElementById('name-input').value.trim();
  const message = document.getElementById('message-input').value.trim();
  
  document.getElementById('name-error').textContent = '';
  document.getElementById('message-error').textContent = '';
  
  if (!name) {
    document.getElementById('name-error').textContent = 'Required';
    return;
  }
  if (!message) {
    document.getElementById('message-error').textContent = 'Required';
    return;
  }
  
  const { error } = await supabase.from('kudos').insert([{
    name, message, category, emoji, created_at: new Date()
  }]);
  
  if (error) {
    alert('Error: ' + error.message);
    return;
  }
  
  document.getElementById('name-input').value = '';
  document.getElementById('message-input').value = '';
  category = 'customer-hero';
  emoji = '😎';
  document.querySelectorAll('.pill')[0].click();
  document.querySelectorAll('.emoji-btn')[0].click();
  
  switchView('wall');
  await renderWall();
  showToast();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('name-input').value = '';
  document.getElementById('message-input').value = '';
  document.getElementById('name-error').textContent = '';
  document.getElementById('message-error').textContent = '';
});

document.getElementById('password-submit').addEventListener('click', () => {
  if (document.getElementById('password-input').value === PASSWORD) {
    authenticated = true;
    document.getElementById('password-modal').classList.add('hidden');
    const target = document.getElementById('password-input').dataset.target || 'wall';
    switchView(target);
  } else {
    document.getElementById('password-error').textContent = 'Incorrect password';
    document.getElementById('password-input').value = '';
  }
});

document.getElementById('password-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('password-submit').click();
});

document.getElementById('password-cancel').addEventListener('click', () => {
  document.getElementById('password-modal').classList.add('hidden');
  authenticated = false;
  switchView('submit');
});

renderWall();
</script>
</body>
</html>
