<!DOCTYPE html>
<html>
<head>
<title>🏆 Customer Heroes & Team Legends</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f5f5; }
.header { background: linear-gradient(135deg, #0F1B3E 0%, #8B5CF6 100%); color: white; padding: 20px; text-align: center; }
.header h1 { font-size: 32px; }
.tabs { display: flex; gap: 10px; padding: 15px; background: white; }
.tab-btn { flex: 1; padding: 10px 20px; border: 2px solid #8B5CF6; background: white; color: #0F1B3E; cursor: pointer; border-radius: 6px; font-weight: 600; }
.tab-btn.active { background: #8B5CF6; color: white; }
.content { padding: 20px; background: white; max-width: 1200px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #0F1B3E; }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border: 2px solid #8B5CF6; border-radius: 6px; font-family: inherit; }
.form-group textarea { min-height: 60px; }
.category-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin: 10px 0; }
.category-btn { padding: 10px; border: 2px solid #8B5CF6; background: white; cursor: pointer; border-radius: 6px; text-align: center; font-weight: 600; }
.category-btn.selected { background: #8B5CF6; color: white; }
.emoji-options { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.emoji-btn { width: 50px; height: 50px; border: 2px solid #8B5CF6; background: white; cursor: pointer; border-radius: 6px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
.emoji-btn.selected { background: #8B5CF6; }
.buttons { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 12px 20px; border: 2px solid #8B5CF6; background: white; color: #0F1B3E; cursor: pointer; border-radius: 6px; font-weight: 600; }
.btn-primary { background: #8B5CF6; color: white; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
.card { background: linear-gradient(135deg, #fff 0%, #FFF8F0 100%); border: 2px solid #8B5CF6; border-radius: 12px; padding: 20px; }
.card-badge { position: absolute; top: 10px; right: 10px; background: #8B5CF6; color: white; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; }
.card-name { font-size: 18px; font-weight: 700; color: #0F1B3E; margin: 10px 0; }
.card-category { font-size: 12px; color: #8B5CF6; font-weight: 600; }
.card-message { font-size: 14px; color: #444; margin: 10px 0; line-height: 1.5; }
.card-emoji { font-size: 40px; margin-bottom: 10px; }
.empty { text-align: center; padding: 40px; color: #999; }
.empty-icon { font-size: 64px; margin-bottom: 20px; }
.error { color: #E53E3E; font-size: 12px; margin-top: 3px; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.modal-content { background: white; border: 2px solid #8B5CF6; border-radius: 12px; padding: 40px; max-width: 350px; text-align: center; }
.modal-content h2 { color: #0F1B3E; margin-bottom: 10px; }
.modal-content input { width: 100%; padding: 10px; border: 2px solid #8B5CF6; border-radius: 6px; margin-bottom: 15px; }
.modal-buttons { display: flex; gap: 10px; }
.modal-buttons button { flex: 1; padding: 10px; border: 2px solid #8B5CF6; background: white; cursor: pointer; border-radius: 6px; font-weight: 600; }
.modal-buttons .btn-primary { background: #8B5CF6; color: white; }
.toast { position: fixed; bottom: 20px; right: 20px; background: #8B5CF6; color: white; padding: 15px 20px; border-radius: 8px; font-weight: 600; display: none; z-index: 2000; }
.toast.show { display: block; }
.present { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0F1B3E 0%, #8B5CF6 100%); display: none; flex-direction: column; padding: 30px; overflow-y: auto; z-index: 2000; }
.present.show { display: flex; }
.present-title { font-size: 56px; color: white; text-align: center; margin-bottom: 10px; font-weight: 700; }
.present-tagline { font-size: 24px; color: #FFF8F0; text-align: center; margin-bottom: 30px; }
.present-close { position: absolute; top: 20px; right: 20px; background: #FF8B3B; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.present .wall { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.present .card { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
.present .card-name { color: white; }
.present .card-message { color: rgba(255,255,255,0.95); }
</style>
</head>
<body>

<div class="header">
  <h1>🏆 Customer Heroes & Team Legends</h1>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(event, 'submit')">✨ Submit</button>
  <button class="tab-btn" onclick="switchTab(event, 'wall')">🎉 Wall</button>
  <button class="tab-btn" onclick="switchTab(event, 'present')">🚀 Present</button>
</div>

<div class="content">
  <div class="section active" id="submit">
    <h2>🏆 Shout Out a Legend</h2>
    <p style="color:#666;margin-bottom:20px">Who made an impact this quarter?</p>
    
    <div class="form-group">
      <label>Teammate Name:</label>
      <input type="text" id="nameInput" placeholder="Enter their name">
      <div class="error" id="nameError"></div>
    </div>

    <div class="form-group">
      <label>What Did They Do?</label>
      <textarea id="messageInput" placeholder="One sentence - keep it punchy!"></textarea>
      <div class="error" id="messageError"></div>
    </div>

    <div class="form-group">
      <label>Category:</label>
      <div class="category-options">
        <button class="category-btn selected" data-cat="hero">💚 Hero</button>
        <button class="category-btn" data-cat="save">🚨 Save</button>
        <button class="category-btn" data-cat="team">🤝 Team</button>
        <button class="category-btn" data-cat="brain">🧠 Brain</button>
        <button class="category-btn" data-cat="unsung">🕵️ Unsung</button>
        <button class="category-btn" data-cat="easier">✨ Easier</button>
      </div>
    </div>

    <div class="form-group">
      <label>Emoji:</label>
      <div class="emoji-options">
        <button class="emoji-btn selected" data-emoji="😎">😎</button>
        <button class="emoji-btn" data-emoji="🚀">🚀</button>
        <button class="emoji-btn" data-emoji="🦸">🦸</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="⭐">⭐</button>
        <button class="emoji-btn" data-emoji="💪">💪</button>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-primary" onclick="submitKudos()">Post to Wall</button>
      <button class="btn" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <div class="section" id="wall">
    <h2>🏆 Customer Heroes & Team Legends</h2>
    <div class="wall" id="wallContainer">
      <div class="empty"><div class="empty-icon">🌟</div>No kudos yet. Be the first!</div>
    </div>
  </div>
</div>

<div class="modal" id="passwordModal">
  <div class="modal-content">
    <h2>🔐 Restricted</h2>
    <p style="color:#E53E3E;font-weight:600">You don't have access</p>
    <p style="font-size:12px;color:#999">Team leads only</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <div class="error" id="passwordError"></div>
    <div class="modal-buttons">
      <button class="btn btn-primary" onclick="checkPassword()">Unlock</button>
      <button class="btn" onclick="closePasswordModal()">Back</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✨ Thanks!</div>

<div class="present" id="presentMode">
  <button class="present-close" onclick="exitPresentation()">Exit</button>
  <div class="present-title">🏆 Customer Heroes</div>
  <div class="present-tagline">Celebrating our squad</div>
  <div class="wall" id="presentWall"></div>
</div>

<script>
const PASSWORD = 'QBRKudos';
const KEY = 'kudos-wall-data';
const API_URL = 'https://script.google.com/macros/s/AKfycbww0gw5bAgVBPGJizQ1ZGhnqkwg1-vFEbbF7oWVJBFhQ_tRbair2WLqxOKweytiWJsa/exec';

let category = 'hero';
let emoji = '😎';
let auth = false;

const CATS = {
  hero: '💚 Customer Hero',
  save: '🚨 Save of Quarter',
  team: '🤝 Ultimate Teammate',
  brain: '🧠 Brain Trust',
  unsung: '🕵️ Unsung Hero',
  easier: '✨ Made Life Easier'
};

async function getAll() {
  try {
    // Try to fetch from backend
    const response = await fetch(API_URL);
    const data = await response.json();
    if (Array.isArray(data) && data.length > 0) {
      return data;
    }
  } catch(e) {
    console.log('Backend fetch failed, using local cache');
  }
  
  // Fall back to local storage
  try {
    const stored = localStorage.getItem(KEY);
    if (stored) return JSON.parse(stored);
  } catch(e) {
    console.log('Local storage error');
  }
  
  return [];
}

function save(all) {
  localStorage.setItem(KEY, JSON.stringify(all));
}

async function switchTab(e, tab) {
  if ((tab === 'wall' || tab === 'present') && !auth) {
    document.getElementById('passwordModal').classList.add('show');
    document.getElementById('passwordInput').focus();
    document.getElementById('passwordInput').dataset.action = tab;
    return;
  }
  
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  
  if (tab === 'wall') await renderWall();
  if (tab === 'present') await renderPresent();
}

async function renderWall() {
  const all = await getAll();
  const container = document.getElementById('wallContainer');
  
  if (all.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🌟</div>No kudos yet!</div>';
    return;
  }
  
  container.innerHTML = all.map(k => `
    <div class="card">
      <div style="font-size:40px;margin-bottom:10px;">${k.emoji}</div>
      <div class="card-name">${k.name}</div>
      <div class="card-category">${CATS[k.category] || k.category}</div>
      <div class="card-message">${k.message || k.msg}</div>
      <div style="font-size:11px;color:#999;margin-top:10px;">${new Date(k.date).toLocaleDateString()}</div>
    </div>
  `).join('');
}

async function renderPresent() {
  const all = await getAll();
  const wall = document.getElementById('presentWall');
  
  if (all.length === 0) {
    wall.innerHTML = '<div class="empty"><div class="empty-icon">🌟</div></div>';
    document.getElementById('presentMode').classList.add('show');
    return;
  }
  
  wall.innerHTML = all.map(k => `
    <div class="card">
      <div style="font-size:40px;margin-bottom:10px;">${k.emoji}</div>
      <div class="card-name">${k.name}</div>
      <div class="card-category">${CATS[k.category] || k.category}</div>
      <div class="card-message">${k.message || k.msg}</div>
    </div>
  `).join('');
  
  document.getElementById('presentMode').classList.add('show');
}

function exitPresentation() {
  document.getElementById('presentMode').classList.remove('show');
  auth = false;
}

async function checkPassword() {
  const pwd = document.getElementById('passwordInput').value;
  
  if (pwd === PASSWORD) {
    auth = true;
    document.getElementById('passwordModal').classList.remove('show');
    const action = document.getElementById('passwordInput').dataset.action;
    document.getElementById('passwordInput').value = '';
    
    if (action === 'wall') {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('wall').classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      await renderWall();
    } else if (action === 'present') {
      await renderPresent();
    }
  } else {
    document.getElementById('passwordError').textContent = 'Wrong password';
    document.getElementById('passwordInput').value = '';
  }
}

function closePasswordModal() {
  document.getElementById('passwordModal').classList.remove('show');
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordError').textContent = '';
}

async function submitKudos() {
  const name = document.getElementById('nameInput').value.trim();
  const msg = document.getElementById('messageInput').value.trim();
  
  document.getElementById('nameError').textContent = '';
  document.getElementById('messageError').textContent = '';
  
  if (!name) { document.getElementById('nameError').textContent = 'Required'; return; }
  if (!msg) { document.getElementById('messageError').textContent = 'Required'; return; }
  
  try {
    // Send to backend
    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        name: name,
        message: msg,
        category: category,
        emoji: emoji
      })
    });
    
    const result = await response.json();
    
    if (result.success) {
      clearForm();
      
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('wall').classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      
      await renderWall();
      
      document.getElementById('toast').classList.add('show');
      setTimeout(() => document.getElementById('toast').classList.remove('show'), 2500);
    } else {
      document.getElementById('messageError').textContent = 'Error posting. Try again.';
    }
  } catch(e) {
    console.log('Submit error:', e);
    document.getElementById('messageError').textContent = 'Connection error. Try again.';
  }
}

function clearForm() {
  document.getElementById('nameInput').value = '';
  document.getElementById('messageInput').value = '';
  category = 'hero';
  emoji = '😎';
}

document.querySelectorAll('.category-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
    e.target.classList.add('selected');
    category = e.target.dataset.cat;
  });
});

document.querySelectorAll('.emoji-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
    e.target.classList.add('selected');
    emoji = e.target.dataset.emoji;
  });
});

document.getElementById('passwordInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') checkPassword();
});

renderWall();
</script>

</body>
</html>
